
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notícia Agora</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f5f7;
    color:#202124;
}

header{
    background:#b40000;
    color:white;
    padding:18px 15px;
}

.topo{
    max-width:900px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav{
    background:#8d0000;
    overflow-x:auto;
    white-space:nowrap;
}

.menu{
    max-width:900px;
    margin:auto;
    display:flex;
}

.menu button{
    border:0;
    background:transparent;
    color:white;
    padding:14px 16px;
    font-weight:bold;
    cursor:pointer;
}

.menu button:active{
    background:#650000;
}

main{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.atualizacao{
    font-size:13px;
    color:#666;
    margin-bottom:15px;
}

.pesquisa{
    display:flex;
    margin-bottom:15px;
}

.pesquisa input{
    flex:1;
    border:1px solid #ccc;
    padding:13px;
    border-radius:8px 0 0 8px;
    font-size:15px;
}

.pesquisa button{
    border:0;
    background:#b40000;
    color:white;
    padding:0 18px;
    border-radius:0 8px 8px 0;
}

.atualizar{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#202124;
    color:white;
    font-weight:bold;
    margin-bottom:20px;
    cursor:pointer;
}

.status{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:12px;
    margin:15px 0;
}

.noticias{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px #00000015;
}

.imagem{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#ddd;
}

.semImagem{
    height:190px;
    background:#252525;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

.conteudo{
    padding:15px;
}

.fonte{
    color:#b40000;
    font-size:12px;
    font-weight:bold;
}

.card h2{
    font-size:18px;
    margin:8px 0;
    line-height:1.35;
}

.data{
    font-size:12px;
    color:#777;
    margin-bottom:12px;
}

.resumo{
    color:#555;
    font-size:14px;
    line-height:1.5;
    margin-bottom:15px;
}

.ler{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#b40000;
    color:white;
    padding:11px;
    border-radius:7px;
    font-weight:bold;
}

footer{
    background:#202124;
    color:#aaa;
    text-align:center;
    padding:30px 15px;
    margin-top:35px;
}

footer strong{
    color:white;
}

@media(max-width:600px){
    .noticias{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
<div class="topo">
    <div class="logo">📰 NOTÍCIA AGORA</div>
    <div id="relogio"></div>
</div>
</header>

<nav>
<div class="menu">
    <button onclick="mudarFeed('geral')">Últimas</button>
    <button onclick="mudarFeed('politica')">Política</button>
    <button onclick="mudarFeed('economia')">Economia</button>
    <button onclick="mudarFeed('tecnologia')">Tecnologia</button>
</div>
</nav>

<main>

<div class="pesquisa">
    <input
        id="busca"
        placeholder="Pesquisar nas notícias carregadas..."
    >
    <button onclick="pesquisar()">🔍</button>
</div>

<button class="atualizar" onclick="carregarNoticias()">
    🔄 ATUALIZAR NOTÍCIAS
</button>

<div class="atualizacao" id="ultimaAtualizacao"></div>

<div id="status" class="status">
    ⏳ Carregando notícias...
</div>

<div id="noticias" class="noticias"></div>

</main>

<footer>
<strong>📰 NOTÍCIA AGORA</strong>
<br><br>
As manchetes são carregadas de fontes externas.
<br>
Toque em "Ler notícia completa" para acessar a publicação original.
</footer>

<script>

/* =========================
   FEEDS
========================= */

const feeds = {

    geral:
    "https://g1.globo.com/rss/g1/",

    politica:
    "https://g1.globo.com/rss/g1/politica/",

    economia:
    "https://g1.globo.com/rss/g1/economia/",

    tecnologia:
    "http://g1.globo.com/dynamo/tecnologia/rss2.xml"

};

let feedAtual = "geral";
let noticiasCarregadas = [];


/* =========================
   TROCAR CATEGORIA
========================= */

function mudarFeed(categoria){

    feedAtual = categoria;

    carregarNoticias();

}


/* =========================
   CARREGAR RSS
========================= */

async function carregarNoticias(){

    const status =
        document.getElementById("status");

    const area =
        document.getElementById("noticias");

    status.style.display = "block";

    status.innerHTML =
        "⏳ Buscando notícias atualizadas...";

    area.innerHTML = "";


    const rss =
        feeds[feedAtual];


    const endereco =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rss);


    try{

        const resposta =
            await fetch(endereco);


        if(!resposta.ok){
            throw new Error(
                "Erro HTTP"
            );
        }


        const dados =
            await resposta.json();


        if(
            dados.status !== "ok" ||
            !dados.items
        ){

            throw new Error(
                "Feed indisponível"
            );

        }


        noticiasCarregadas =
            dados.items;


        mostrarNoticias(
            noticiasCarregadas
        );


        status.style.display =
            "none";


        document
        .getElementById(
            "ultimaAtualizacao"
        )
        .innerText =

        "Atualizado em " +
        new Date()
        .toLocaleTimeString(
            "pt-BR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    }

    catch(erro){

        console.error(erro);

        status.style.display =
            "block";

        status.innerHTML = `
            ⚠️ Não foi possível carregar
            as notícias neste momento.
            <br><br>
            Verifique sua internet e
            tente novamente.
        `;

    }

}


/* =========================
   MOSTRAR NOTÍCIAS
========================= */

function mostrarNoticias(lista){

    const area =
        document.getElementById(
            "noticias"
        );

    area.innerHTML = "";


    if(lista.length === 0){

        area.innerHTML = `
            <div class="status">
                Nenhuma notícia encontrada.
            </div>
        `;

        return;

    }


    lista.forEach(item => {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "card";


        const imagem =
            encontrarImagem(item);


        const resumo =
            limparHTML(
                item.description || ""
            )
            .substring(0,180);


        const data =
            formatarData(
                item.pubDate
            );


        card.innerHTML = `

            ${
                imagem

                ?

                `<img
                    class="imagem"
                    src="${imagem}"
                    alt=""
                    loading="lazy"
                    onerror="
                        this.style.display='none'
                    "
                >`

                :

                `<div class="semImagem">
                    📰
                </div>`
            }

            <div class="conteudo">

                <span class="fonte">
                    G1
                </span>

                <h2>
                    ${escapar(item.title)}
                </h2>

                <div class="data">
                    ${data}
                </div>

                <div class="resumo">
                    ${escapar(resumo)}
                    ${resumo.length >= 180 ? "..." : ""}
                </div>

                <a
                    class="ler"
                    href="${item.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    LER NOTÍCIA COMPLETA ↗
                </a>

            </div>

        `;


        area.appendChild(card);

    });

}


/* =========================
   PROCURAR IMAGEM
========================= */

function encontrarImagem(item){

    if(
        item.thumbnail &&
        item.thumbnail.startsWith("http")
    ){

        return item.thumbnail;

    }


    if(
        item.enclosure &&
        item.enclosure.link
    ){

        return item.enclosure.link;

    }


    const html =
        item.content ||
        item.description ||
        "";


    const resultado =
        html.match(
            /<img[^>]+src=["']([^"']+)["']/i
        );


    if(resultado){
        return resultado[1];
    }


    return "";

}


/* =========================
   PESQUISA
========================= */

function pesquisar(){

    const termo =
        document
        .getElementById("busca")
        .value
        .toLowerCase()
        .trim();


    if(!termo){

        mostrarNoticias(
            noticiasCarregadas
        );

        return;

    }


    const resultado =
        noticiasCarregadas
        .filter(item => {

            const titulo =
                (
                    item.title ||
                    ""
                )
                .toLowerCase();


            const descricao =
                limparHTML(
                    item.description ||
                    ""
                )
                .toLowerCase();


            return (
                titulo.includes(termo) ||
                descricao.includes(termo)
            );

        });


    mostrarNoticias(resultado);

}


document
.getElementById("busca")
.addEventListener(
    "input",
    pesquisar
);


/* =========================
   SEGURANÇA / TEXTO
========================= */

function limparHTML(texto){

    const elemento =
        document.createElement(
            "div"
        );

    elemento.innerHTML =
        texto;

    return (
        elemento.textContent ||
        elemento.innerText ||
        ""
    );

}


function escapar(texto){

    const elemento =
        document.createElement(
            "div"
        );

    elemento.textContent =
        texto || "";

    return elemento.innerHTML;

}


/* =========================
   DATA
========================= */

function formatarData(data){

    if(!data){
        return "";
    }

    const d =
        new Date(
            data.replace(
                " ",
                "T"
            )
        );


    if(
        isNaN(
            d.getTime()
        )
    ){

        return data;

    }


    return d.toLocaleString(
        "pt-BR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* DATA NO TOPO */

function atualizarRelogio(){

    document
    .getElementById("relogio")
    .innerText =

    new Date()
    .toLocaleDateString(
        "pt-BR"
    );

}


atualizarRelogio();


/* =========================
   INICIAR
========================= */

carregarNoticias();

</script>

</body>
</html>
